<!doctype html>
<meta charset="utf-8">
<title>embed test</title>
<body style="font:14px system-ui;padding:16px">
<h3>유튜브 임베드 재생 가능 여부</h3>
<div id="out">확인 중…</div>
<div id="players" style="opacity:.01;height:1px;overflow:hidden"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // 비교용: 지금 잘 나오는 클립 하나 + 문제로 의심되는 영상
  var VIDEOS = [
    { id: '5GjcsPyLKyM', label: '의심 영상 (Right foot! 등 5개가 쓰는 영상)' },
    { id: '0yEovMBdGGM', label: '대조군 (Drop! 이 쓰는 영상)' }
  ];
  var results = {};
  function render() {
    document.getElementById('out').innerHTML = VIDEOS.map(function (v) {
      var r = results[v.id] || '대기 중';
      return '<p><b>' + v.id + '</b> — ' + v.label + '<br>결과: <b>' + r + '</b></p>';
    }).join('');
  }
  function onYouTubeIframeAPIReady() {
    VIDEOS.forEach(function (v) {
      var host = document.createElement('div');
      host.id = 'p_' + v.id;
      document.getElementById('players').appendChild(host);
      new YT.Player(host.id, {
        videoId: v.id,
        events: {
          onReady: function (e) { results[v.id] = '플레이어 준비됨 (임베드 허용)'; render(); e.target.mute(); e.target.playVideo(); },
          onStateChange: function (e) { if (e.data === YT.PlayerState.PLAYING) { results[v.id] = '재생됨 — 임베드 정상'; render(); } },
          onError: function (e) {
            var why = { 2: '잘못된 ID', 5: 'HTML5 오류', 100: '삭제·비공개', 101: '임베드 금지', 150: '임베드 금지' }[e.data] || ('오류 ' + e.data);
            results[v.id] = '실패 — ' + why; render();
          }
        }
      });
    });
    render();
  }
</script>
</body>
